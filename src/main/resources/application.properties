spring.application.name=finance-api

spring.datasource.url=jdbc:postgresql://localhost:5432/finance-api_database
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.file.name=logs/finance-api.log
logging.level.com.financeapi=DEBUG

# application.properties
bank.currency.sender-currency-fee-multiplyer=0.05
security.jwt.token.secret-key=${JWT_SECRET_KEY}

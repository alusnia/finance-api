spring.application.name=finance-api

spring.datasource.url=jdbc:postgresql://localhost:5432/finance-api_database
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=f93f8cc62633d5

spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

logging.file.name=logs/finance-api.log
logging.level.com.financeapi=DEBUG

# application.properties
bank.currency.sender-currency-fee-multiplier=0.05
security.jwt.token.secret-key=${JWT_SECRET_KEY}
notification.email.number-of-retries=5
